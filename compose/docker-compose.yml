services:
  app:
    image: nginx:1.27-alpine
    container_name: homework-app
    restart: unless-stopped
    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: homework-proxy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

networks:
  app-network:
    name: homework-compose-network
    driver: bridge
